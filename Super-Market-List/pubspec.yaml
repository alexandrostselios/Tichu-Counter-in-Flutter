name: super_market_list

description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.0.11  # Check for the latest version
  cupertino_icons: ^1.0.8
  package_info_plus: ^8.0.2
  device_info_plus: ^11.0.0
  intl: ^0.19.0 # Ensure this matches the version required by flutter_localizations
  flutter_localizations:
    sdk: flutter # Include flutter_localizations for localization support
  provider: ^6.0.3 # Add this for state management
  font_awesome_flutter: ^10.5.0
  xml: ^6.1.0
  permission_handler: ^11.2.0 # or the latest version
  characters: ^1.2.0
  http: ^1.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  intl_utils: ^2.0.0 # Add this for localization generation
  flutter_launcher_icons: ^0.9.2 # Check for the latest version


flutter_icons:
  android: true
  ios: true
  image_path: "assets/shopping_cart.ico" # Replace with your image path


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/flags/
    - assets/images/
    - assets/images/categories/
    - assets/images/vegetables/
    - assets/images/milk/
    - assets/images/hygiene/
    - assets/images/chicken/
    - assets/images/cow/
    - assets/images/pork/